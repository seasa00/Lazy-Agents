[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-office-api"
version = "0.1.0"
description = "AI Office backend contracts and isolated agent runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain-core>=1.8.2,<2",
    "langgraph>=1.2.24,<1.3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
"app.persistence" = ["migrations/*.sql"]
